name: darazinda_connect
description: >
  Tehsil Darazinda Slow Network — Signal Mapping & Complaint App.
  Measure, map, and report mobile network connectivity problems in
  Darazinda Tehsil with evidence-based, crowdsourced data.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management. Providers are hand-written (no @riverpod
  # codegen) so we deliberately don't depend on riverpod_annotation /
  # riverpod_generator — one less moving part, and it avoids a real
  # crash seen with riverpod_generator's pinned analyzer version
  # against newer Dart SDKs (see git history / QA notes).
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.0.1
  firebase_analytics: ^11.0.1
  firebase_crashlytics: ^4.0.1

  # Offline-first local database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Connectivity / device / location
  connectivity_plus: ^6.0.4
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0

  # Map (OpenStreetMap — no API key / properly licensed under ODbL)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_map_marker_cluster: ^1.3.6

  # PDF report generation
  pdf: ^3.11.0
  printing: ^5.13.1

  # Networking / speed test
  dio: ^5.4.3+1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  equatable: ^2.0.5
  fl_chart: ^0.68.0
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/branding/

flutter_intl:
  enabled: true
