pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def path = properties.getProperty("flutter.sdk")
        assert path != null, "flutter.sdk not set in local.properties"
        return path
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // AGP/Kotlin versions pinned to EXACTLY what Flutter 3.24.5's own
    // `flutter create` template generates (verified by generating a
    // reference project with this same Flutter SDK and diffing it
    // against this file). Flutter plugin packages (geolocator_android
    // etc.) assume this baseline; a newer AGP (8.3.0 was here before)
    // changed internal LibraryExtension/BaseExtension APIs enough that
    // the Flutter Gradle plugin's `flutter` property injection into
    // plugin subprojects broke with "Could not get unknown property
    // 'flutter' for extension 'android'" — the real root cause of the
    // CI build failures fixed by this change. See git history.
    id "com.android.application" version "8.1.0" apply false
    id "org.jetbrains.kotlin.android" version "1.8.22" apply false
    id "com.google.gms.google-services" version "4.4.2" apply false
    id "com.google.firebase.crashlytics" version "3.0.2" apply false
}

include ":app"
