plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    // Applied conditionally below, only once a real google-services.json
    // exists. Applying these unconditionally makes the Gradle build fail
    // at configuration time on any checkout without a configured Firebase
    // project (see comment near the bottom of this file).
    id "com.google.gms.google-services" apply false
    id "com.google.firebase.crashlytics" apply false
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '0.1.0'

android {
    namespace "pk.darazindaconnect.app"
    // Deliberately read from the `flutter` extension (injected by the
    // dev.flutter.flutter-gradle-plugin applied above), NOT hardcoded
    // literals. Flutter plugin packages (e.g. geolocator_android) ship
    // their own android/build.gradle referencing `flutter.compileSdkVersion`
    // directly; if this app module doesn't also resolve compileSdk/
    // ndkVersion through that same extension, Gradle can fail evaluating
    // those plugin subprojects with "Could not get unknown property
    // 'flutter'" / "compileSdkVersion is not specified" — exactly the
    // real failure hit in CI before this fix (see git history).
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // Verify availability on Google Play Console before final publication.
        applicationId "pk.darazindaconnect.app"
        minSdk 23
        targetSdk flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            // TODO before publishing: configure a real release signing
            // config; do not ship using the debug keystore.
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.1.0')
}

// google-services.json is intentionally NOT committed (see .gitignore —
// it would embed a real Firebase project's API keys). Run
// `flutterfire configure` to generate a real one before release; until
// then these Firebase Gradle plugins are skipped so `flutter build apk`
// still succeeds for local development/testing of everything that
// doesn't need Firebase.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
    apply plugin: "com.google.firebase.crashlytics"
} else {
    logger.warn(
        "WARNING: android/app/google-services.json not found — " +
        "Firebase Gradle plugins were skipped. Run `flutterfire configure` " +
        "before building a release intended to use Firebase."
    )
}
